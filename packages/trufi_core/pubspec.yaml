name: trufi_core
description: A Flutter Plugin for Public Transport.
version: 3.29.3
homepage: https://www.trufi-association.org/
repository: https://github.com/trufi-association/trufi-core

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  in_app_review: ^2.0.10
  async: ^2.12.0
  async_executor: ^0.0.2
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  device_info_plus: ^13.3.0
  diff_match_patch: ^0.4.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter  
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_map: ^8.3.2
  flutter_svg: ^2.1.0
  geolocator: ^14.0.0
  graphql: ^5.2.0
  hive: ^2.2.3
  intl: ^0.20.3
  # flutter_map_marker_cluster 8.2.2 requires the 0.9.x API.
  latlong2: ^0.9.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  provider: ^6.1.4
  routemaster: ^1.0.1
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  synchronized: ^3.3.1
  # app_links: ^6.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

